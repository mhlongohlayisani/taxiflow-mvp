<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiFlow | Smart Taxi Rank Mapping</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            overflow: hidden;
        }

        .top-nav {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .brand {
            background: #111827;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            border-bottom: 4px solid #16a34a;
        }

        .brand h1 { color: white; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
        .brand span { color: #22c55e; }
        .brand p { color: #9ca3af; font-size: 12px; margin-top: 2px; }

        .login-btn {
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4);
            pointer-events: auto;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-btn:hover { background: #15803d; transform: translateY(-2px); }

        #map {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
            z-index: 1;
        }
        
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 5px; }
        .leaflet-popup-content b { color: #111827; font-size: 15px; display: block; margin-bottom: 5px; }
        .leaflet-popup-content p { color: #4b5563; margin: 0; font-size: 13px; }
        
        @media (max-width: 600px) {
            .top-nav { flex-direction: column; align-items: stretch; gap: 15px; top: 15px; left: 15px; right: 15px; }
            .brand { text-align: center; align-items: center; }
            .login-btn { justify-content: center; }
        }

        .action-bar {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            display: flex; gap: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-btn {
            background: transparent; color: white;
            border: none; padding: 10px 20px;
            border-radius: 40px; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .action-btn:hover, .action-btn.active { background: #16a34a; }

        .vehicle-icon {
            font-size: 24px;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5));
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        .user-location-icon {
            background-color: #3b82f6;
            border: 3px solid white; border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        
        .ai-chat-btn {
            position: absolute; bottom: 100px; right: 20px; z-index: 9999;
            background: #111827; color: white; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 2px solid #22c55e;
            transition: transform 0.2s ease;
        }
        .ai-chat-btn:hover { transform: scale(1.05); }

        .ai-chat-panel {
            position: absolute; bottom: 165px; right: 20px; width: 330px;
            background: white; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            z-index: 9999; display: none; flex-direction: column; overflow: hidden; border: 1px solid #e5e7eb;
        }
        .ai-chat-header {
            background: #111827; color: white; padding: 16px; font-weight: 900;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ai-chat-header span { color: #22c55e; }
        .ai-chat-close { cursor: pointer; color: #9ca3af; font-size: 18px; }
        .ai-chat-close:hover { color: white; }
        .ai-chat-messages {
            height: 280px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; background: #f9fafb;
        }
        .msg-bot { background: #e5e7eb; color: #111827; padding: 12px; border-radius: 12px 12px 12px 0; align-self: flex-start; max-width: 85%; }
        .msg-user { background: #16a34a; color: white; padding: 12px; border-radius: 12px 12px 0 12px; align-self: flex-end; max-width: 85%; }
        .ai-chat-input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #e5e7eb; }
        .ai-chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
        .ai-chat-input-area button { background: #16a34a; color: white; border: none; padding: 0 16px; margin-left: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Navigation Overlay -->
    <div class="top-nav">
        <div class="brand">
            <h1>Taxi<span>Flow</span></h1>
            <p>Live Route & Rank Mapping</p>
        </div>
        <a href="/login.html" class="login-btn">
            Portal Login 
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
        </a>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <button class="action-btn active" id="btn-ranks" onclick="showLayer('ranks')">🏢 Ranks</button>
        <button class="action-btn" id="btn-taxis" onclick="showLayer('taxis')">🚕 Taxis Near Me</button>
    </div>

    <!-- AI Chat Assistant -->
    <div class="ai-chat-btn" onclick="toggleChat()" title="Ask TaxiFlow AI">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <div>TaxiFlow <span>AI Guide</span></div>
            <div class="ai-chat-close" onclick="toggleChat()">✕</div>
        </div>
        <div class="ai-chat-messages" id="chatMessages">
            <div class="msg-bot">Heita! I'm your TaxiFlow AI assistant. Ask me about taxi routes, ranks, or live vehicle statuses in your area!</div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') sendGeminiMessage()">
            <button onclick="sendGeminiMessage()">Send</button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_BASE = "http://localhost:3000";
        let map;
        let rankLayer;
        let vehicleLayer;
        let userMarker = null;
        let currentMode = 'ranks'; // 'ranks' or 'taxis'

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([-23.8333, 30.1667], 13); 

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            rankLayer = L.layerGroup().addTo(map);
            vehicleLayer = L.layerGroup().addTo(map);

            // Get User Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    const userIcon = L.divIcon({ className: 'user-location-icon', iconSize: [16, 16] });
                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("<b>You are here</b>").openPopup();
                    map.setView([lat, lng], 14);
                }, () => {});
            }

            // Load initial ranks
            loadRanksOnMap();

            // Refresh data periodically
            setInterval(() => {
                if (currentMode === 'ranks') loadRanksOnMap();
                if (currentMode === 'taxis') loadLiveTaxisOnMap();
            }, 8000);
        };

        function setActiveButton(btnId) {
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
        }

        async function loadRanksOnMap() {
            currentMode = 'ranks';
            setActiveButton('btn-ranks');
            vehicleLayer.clearLayers();
            rankLayer.clearLayers();

            try {
                const res = await fetch(`${API_BASE}/api/ranks`);
                const data = await res.json();
                if (data.success && data.ranks) {
                    data.ranks.forEach(r => {
                        if (r.latitude && r.longitude) {
                            const marker = L.marker([r.latitude, r.longitude]);
                            marker.bindPopup(`<b>🏢 ${escapeHtml(r.name)}</b><p>${escapeHtml(r.address || 'Taxi Rank')}</p><p>Status: <b>${r.is_open !== false ? 'OPEN' : 'CLOSED'}</b></p>`);
                            rankLayer.addLayer(marker);
                        }
                    });
                }
            } catch (e) {
                console.error("Error loading ranks:", e);
            }
        }

        async function loadLiveTaxisOnMap() {
            currentMode = 'taxis';
            setActiveButton('btn-taxis');
            rankLayer.clearLayers();
            vehicleLayer.clearLayers();

            try {
                const res = await fetch(`${API_BASE}/api/drivers/live`);
                const data = await res.json();
                if (data.success && data.drivers) {
                    data.drivers.forEach(d => {
                        if (d.latitude && d.longitude && d.show_on_map !== false) {
                            const isFull = d.is_full;
                            const emoji = isFull ? '🔴' : '🟢';
                            const customIcon = L.divIcon({
                                className: 'vehicle-icon',
                                html: `<span>🚖</span>`,
                                iconSize: [30, 30],
                                iconAnchor: [15, 15]
                            });

                            const marker = L.marker([d.latitude, d.longitude], { icon: customIcon });
                            marker.bindPopup(`<b>🚖 Live Taxi</b><p>Destination: <b>${escapeHtml(d.destination || 'Not Specified')}</b></p><p>Status: <span style="color:${isFull?'red':'green'}; font-weight:bold;">${isFull ? 'FULL' : 'NOT FULL'}</span> (${d.passengers_inside || 0} passengers)</p>`);
                            vehicleLayer.addLayer(marker);
                        }
                    });
                }
            } catch (e) {
                console.error("Error loading live taxis:", e);
            }
        }

        window.showLayer = function(layerName) {
            if (layerName === 'ranks') loadRanksOnMap();
            if (layerName === 'taxis') loadLiveTaxisOnMap();
        };

        function toggleChat() {
            const panel = document.getElementById('aiChatPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendGeminiMessage() {
            const inputField = document.getElementById('chatInput');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatMessages');
            const userDiv = document.createElement('div');
            userDiv.className = 'msg-user';
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);
            
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg-bot';
            loadingDiv.innerHTML = '<i>Typing...</i>';
            loadingDiv.id = 'loadingMsg';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const systemPrompt = "You are TaxiFlow AI, a helpful, friendly, and street-smart assistant for taxi commuters in South Africa. Help users with general questions about taxi routes, safety, and etiquette.";
                
                const payload = {
                    contents: [{ parts: [{ text: message }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const botResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I missed that. Try asking again!";
                
                document.getElementById('loadingMsg').remove();
                const botDiv = document.createElement('div');
                botDiv.className = 'msg-bot';
                botDiv.innerHTML = botResponse.replace(/\n/g, '<br>');
                chatBox.appendChild(botDiv);
                
            } catch (error) {
                document.getElementById('loadingMsg').remove();
                const errDiv = document.createElement('div');
                errDiv.className = 'msg-bot';
                errDiv.textContent = "Oops, connection error.";
                chatBox.appendChild(errDiv);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(val) { return String(val ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
