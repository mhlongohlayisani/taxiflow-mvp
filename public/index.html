<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiFlow | Smart Taxi Rank Mapping</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            overflow: hidden; /* Prevent scrollbars, map takes full screen */
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 9999; /* Stay above the map */
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; /* Let clicks pass through the empty space */
        }

        .brand {
            background: #111827;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: auto; /* Re-enable clicks for the brand box */
            display: flex;
            flex-direction: column;
            border-bottom: 4px solid #16a34a;
        }

        .brand h1 {
            color: white;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #22c55e;
        }

        .brand p {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 2px;
        }

        .login-btn {
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4);
            pointer-events: auto;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
        }

        .login-btn:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.5);
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Below the UI overlay */
        }
        
        /* Custom map popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 5px;
        }
        .leaflet-popup-content b {
            color: #111827;
            font-size: 15px;
            display: block;
            margin-bottom: 5px;
        }
        .leaflet-popup-content p {
            color: #4b5563;
            margin: 0;
            font-size: 13px;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .top-nav {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
                top: 15px;
                left: 15px;
                right: 15px;
            }
            .brand {
                text-align: center;
                align-items: center;
            }
            .login-btn {
                justify-content: center;
            }
        }

        .action-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            display: flex;
            gap: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .action-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover, .action-btn.active {
            background: #16a34a;
        }

        .action-btn.bus:hover, .action-btn.bus.active {
            background: #2563eb; /* Blue theme for buses */
        }
        
        .vehicle-icon {
            font-size: 24px;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.5));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .user-location-icon {
            background-color: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        
        .ai-chat-btn {
            position: absolute;
            bottom: 100px;
            right: 20px;
            z-index: 9999;
            background: #111827;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid #22c55e;
            transition: transform 0.2s ease;
        }
        .ai-chat-btn:hover {
            transform: scale(1.05);
        }
        .ai-chat-panel {
            position: absolute;
            bottom: 165px;
            right: 20px;
            width: 330px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            z-index: 9999;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        .ai-chat-header {
            background: #111827;
            color: white;
            padding: 16px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-chat-header span {
            color: #22c55e;
        }
        .ai-chat-close {
            cursor: pointer;
            color: #9ca3af;
            font-size: 18px;
            line-height: 1;
        }
        .ai-chat-close:hover {
            color: white;
        }
        .ai-chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            background: #f9fafb;
        }
        .msg-bot {
            background: #e5e7eb;
            color: #111827;
            padding: 12px;
            border-radius: 12px 12px 12px 0;
            align-self: flex-start;
            max-width: 85%;
            line-height: 1.4;
        }
        .msg-user {
            background: #16a34a;
            color: white;
            padding: 12px;
            border-radius: 12px 12px 0 12px;
            align-self: flex-end;
            max-width: 85%;
            line-height: 1.4;
        }
        .ai-chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        .ai-chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .ai-chat-input-area input:focus {
            border-color: #16a34a;
        }
        .ai-chat-input-area button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .ai-chat-input-area button:hover {
            background: #15803d;
        }

        /* ================================================================
           TAXIFLOW PUBLIC MAP UI REFRESH
           Visual-only layer: existing map, buttons and AI functions remain.
        ================================================================= */
        :root {
            --tf-navy: #07111f;
            --tf-navy-soft: #10243a;
            --tf-green: #10b981;
            --tf-green-dark: #047857;
            --tf-blue: #2563eb;
            --tf-white: #ffffff;
            --tf-border: #d9e4ea;
            --tf-muted: #64748b;
        }

        html, body { width: 100%; height: 100%; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #dfe8ec;
            color: #102033;
            -webkit-font-smoothing: antialiased;
        }
        button, input { font: inherit; }
        button, a, .ai-chat-btn, .ai-chat-close { -webkit-tap-highlight-color: transparent; }
        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        .ai-chat-btn:focus-visible,
        .ai-chat-close:focus-visible {
            outline: 3px solid rgba(16,185,129,.38);
            outline-offset: 3px;
        }

        .top-nav {
            position: fixed;
            top: 18px;
            left: 18px;
            right: 18px;
            min-height: 66px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
            background: rgba(7,17,31,.95);
            box-shadow: 0 18px 45px rgba(7,17,31,.27);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .brand {
            min-width: 0;
            padding: 7px 13px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            box-shadow: none;
        }
        .brand h1 {
            font-size: 1.35rem;
            line-height: 1.1;
            letter-spacing: -.055em;
        }
        .brand span { color: #34d399; }
        .brand p {
            margin-top: 4px;
            color: #9fb0c3;
            font-size: .72rem;
            line-height: 1.2;
        }
        .login-btn {
            min-height: 48px;
            padding: 12px 18px;
            border: 1px solid rgba(110,231,183,.24);
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #059669);

            font-size: .84rem;
            white-space: nowrap;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #0da977, #047857);
            box-shadow: 0 9px 24px rgba(5,150,105,.32);
            transform: translateY(-1px);
        }

        #map { position: fixed; height: 100dvh; }
        .leaflet-control-layers,
        .leaflet-bar {
            overflow: hidden;
            border: 0 !important;
            border-radius: 11px !important;
            box-shadow: 0 8px 24px rgba(15,23,42,.2) !important;
        }
        .leaflet-control-zoom a { width: 36px !important; height: 36px !important; line-height: 36px !important; }
        .leaflet-popup-content-wrapper {
            padding: 6px;
            border: 1px solid #dce5ec;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(15,23,42,.18);
        }
        .leaflet-popup-content { margin: 12px 14px; line-height: 1.5; }
        .leaflet-popup-content b { color: #07111f; font-size: .9rem; }
        .leaflet-popup-content p { color: var(--tf-muted); font-size: .78rem; }

        .action-bar {
            position: fixed;
            bottom: 18px;
            padding: 7px;
            gap: 5px;
            border-radius: 17px;
            background: rgba(7,17,31,.96);
            border-color: rgba(255,255,255,.12);
            box-shadow: 0 18px 45px rgba(7,17,31,.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .action-btn {
            min-height: 48px;
            padding: 11px 18px;
            border-radius: 12px;
            color: #e8eef5;
            font-size: .82rem;
            line-height: 1.2;
            white-space: nowrap;
        }
        .action-btn:hover, .action-btn.active { background: #0f9f72; color: #fff; }
        .action-btn.bus:hover, .action-btn.bus.active { background: var(--tf-blue); }

        .ai-chat-btn {
            position: fixed;
            right: 18px;
            bottom: 90px;
            width: auto;
            min-width: 116px;
            height: 50px;
            padding: 0 15px;
            gap: 9px;
            border: 1px solid rgba(110,231,183,.35);
            border-radius: 14px;
            background: rgba(7,17,31,.96);
            box-shadow: 0 14px 35px rgba(7,17,31,.3);
            font-size: .78rem;
            font-weight: 800;
        }
        .ai-chat-btn:hover { background: #10243a; transform: translateY(-2px); }
        .ai-chat-btn span { color: #dffaf0; white-space: nowrap; }

        .ai-chat-panel {
            position: fixed;
            right: 18px;
            bottom: 150px;
            width: min(390px, calc(100vw - 36px));
            max-height: min(570px, calc(100dvh - 250px));
            border: 1px solid rgba(203,213,225,.95);
            border-radius: 20px;
            box-shadow: 0 28px 70px rgba(7,17,31,.32);
        }
        .ai-chat-header {
            min-height: 60px;
            padding: 15px 17px;
            background: linear-gradient(135deg, #07111f, #10243a);
            font-size: .92rem;
        }
        .ai-chat-header span { color: #6ee7b7; }
        .ai-chat-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            color: #cbd5e1;
        }
        .ai-chat-close:hover { background: rgba(255,255,255,.08); }
        .ai-chat-messages {
            height: min(330px, calc(100dvh - 390px));
            min-height: 220px;
            padding: 16px;
            gap: 12px;
            background: #f5f8fa;
            font-size: .85rem;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        .msg-bot, .msg-user {
            max-width: 88%;
            padding: 11px 13px;
            line-height: 1.5;
            box-shadow: 0 3px 9px rgba(15,23,42,.05);
        }
        .msg-bot { border: 1px solid #dce5ec; background: #fff; }
        .msg-user { background: #0f9f72; }
        .ai-chat-input-area { padding: 11px; border-color: #dce5ec; }
        .ai-chat-input-area input {
            min-width: 0;
            min-height: 46px;
            padding: 11px 13px;
            border-color: #d5e0e7;
            border-radius: 11px;
            background: #f8fafc;
            font-size: .86rem;
        }
        .ai-chat-input-area input:focus {
            border-color: var(--tf-green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(16,185,129,.11);
        }
        .ai-chat-input-area button {
            min-width: 70px;
            min-height: 46px;
            padding: 0 14px;
            border-radius: 11px;
            background: #0f9f72;
        }

        @media (max-width: 700px) {
            .top-nav {
                top: 10px;
                left: 10px;
                right: 10px;
                min-height: 62px;
                padding: 7px;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                border-radius: 15px;
            }
            .brand { align-items: flex-start; padding: 6px 8px; text-align: left; }
            .brand h1 { font-size: 1.15rem; }
            .brand p { font-size: .65rem; }
            .login-btn {
                min-height: 46px;
                padding: 10px 12px;
                justify-content: center;
                font-size: .76rem;
            }
            .action-bar {
                left: 8px;
                right: 8px;
                bottom: max(8px, env(safe-area-inset-bottom));
                transform: none;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 4px;
                padding: 5px;
                border-radius: 15px;
            }
            .action-btn {
                min-width: 0;
                min-height: 51px;
                padding: 8px 5px;
                justify-content: center;
                font-size: .69rem;
                text-align: center;
                white-space: normal;
            }
            .ai-chat-btn {
                right: 10px;
                bottom: calc(75px + env(safe-area-inset-bottom));
                min-width: 52px;
                width: 52px;
                height: 52px;
                padding: 0;
                border-radius: 15px;
            }
            .ai-chat-btn span { display: none; }
            .ai-chat-panel {
                left: 10px;
                right: 10px;
                bottom: calc(139px + env(safe-area-inset-bottom));
                width: auto;
                max-height: calc(100dvh - 225px - env(safe-area-inset-bottom));
                border-radius: 20px;
            }
            .ai-chat-messages {
                height: min(320px, calc(100dvh - 360px));
                min-height: 190px;
            }
            .leaflet-top { top: 78px; }
            .leaflet-bottom { bottom: 76px; }
        }

        @media (max-width: 390px) {
            .brand p { display: none; }
            .login-btn { padding: 9px 10px; }
            .login-btn svg { display: none; }
            .action-btn { font-size: .65rem; }
            .ai-chat-panel { left: 6px; right: 6px; }
            .ai-chat-input-area button { min-width: 60px; padding: 0 10px; }
        }

        @media (max-height: 650px) and (max-width: 700px) {
            .ai-chat-panel { top: 82px; bottom: 139px; max-height: none; }
            .ai-chat-messages { height: auto; min-height: 0; flex: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>

    <link
    rel="stylesheet"

</head>
<body>

    <!-- Floating UI Overlay -->
    <div class="top-nav">
        <div class="brand">
            <h1>Taxi<span>Flow</span></h1>
            <p>Live Route & Rank Mapping</p>
        </div>

        <a href="/login.html" class="login-btn">
            Portal Login 
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
        </a>
    </div>

    <!-- Action Bar at bottom -->
    <div class="action-bar">
        <button class="action-btn active" id="btn-ranks" onclick="showLayer('ranks')">
            🏢 Ranks
        </button>
        <button class="action-btn" id="btn-taxis" onclick="findVehicles('taxi')">
            🚕 Taxis Near Me
        </button>
        <button class="action-btn bus" id="btn-buses" onclick="findVehicles('bus')">
            🚌 Buses Near Me
        </button>
    </div>

    <!-- AI Chat Interface -->
    <div class="ai-chat-btn" onclick="toggleChat()" title="Ask TaxiFlow AI">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>AI Guide</span>
    </div>
    
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <div>TaxiFlow <span>AI Guide</span></div>
            <div class="ai-chat-close" onclick="toggleChat()">✕</div>
        </div>
        <div class="ai-chat-messages" id="chatMessages">
            <div class="msg-bot">Heita! I'm your TaxiFlow AI assistant. I can help you with taxi etiquette, safety tips, and explaining how to use the map while we wait for drivers to connect. What do you need?</div>
        </div>
        <div class="ai-chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') sendGeminiMessage()">
            <button onclick="sendGeminiMessage()">Send</button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let rankLayer;
        let vehicleLayer;
        let userMarker = null;

        // Wait for the window to load before setting up the map
        window.onload = function() {
            
            // Initialize map (Default to Mankweng area, will update to user location if allowed)
            map = L.map('map', {
                zoomControl: false 
            }).setView([-23.8863, 29.7289], 13); 

            // Add standard OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            
            // Add zoom control to bottom right
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            // Initialize Layer Groups (Ready to receive REAL data from the backend later)
            rankLayer = L.layerGroup().addTo(map);
            vehicleLayer = L.layerGroup().addTo(map);

            // Request User's Real Device Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    const userIcon = L.divIcon({ className: 'user-location-icon', iconSize: [16, 16] });
                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("<b>You are here</b><br>TaxiFlow is standing by.").openPopup();
                    
                    // Fly to the user's actual location
                    map.setView([lat, lng], 14);
                }, () => {
                    console.log("Location access denied or unavailable.");
                });
            }
        };

        function setActiveButton(btnId) {
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
        }

        window.showLayer = function(layerName) {
            setActiveButton('btn-ranks');
            vehicleLayer.clearLayers();
            
            // Re-add the rank layer (It is empty now, but will show registered ranks later)
            map.addLayer(rankLayer);
            
            // Focus back on user if we have their location
            if (userMarker) {
                map.flyTo(userMarker.getLatLng(), 13, { animate: true, duration: 1 });
                userMarker.bindPopup("<b>Checking for registered ranks...</b>").openPopup();
            }
        };

        window.findVehicles = function(type) {
            const isTaxi = type === 'taxi';
            setActiveButton(isTaxi ? 'btn-taxis' : 'btn-buses');
            
            // Hide ranks, clear old vehicles
            map.removeLayer(rankLayer);
            vehicleLayer.clearLayers();

            // Focus on user and show waiting state (Will fetch real driver coords later)
            if (userMarker) {
                map.flyTo(userMarker.getLatLng(), 15, { animate: true, duration: 1.5 });
                userMarker.bindPopup(`<b>Scanning for nearby ${isTaxi ? 'Taxis' : 'Buses'}...</b><br>Waiting for live drivers to connect to the network.`).openPopup();
            }
        };

        // ==========================================
        // TAXIFLOW AI (GEMINI) INTEGRATION
        // ==========================================
        function toggleChat() {
            const panel = document.getElementById('aiChatPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendGeminiMessage() {
            const inputField = document.getElementById('chatInput');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatMessages');
            
            // Render the user's message
            const userDiv = document.createElement('div');
            userDiv.className = 'msg-user';
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);
            
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Render a loading state for the bot
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg-bot';
            loadingDiv.innerHTML = '<i>Typing...</i>';
            loadingDiv.id = 'loadingMsg';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Call Gemini API via standard fetch
                const apiKey = ""; // Automatically handled by the environment
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                // Give the AI a persona
                const systemPrompt = "You are TaxiFlow AI, a helpful, friendly, and street-smart assistant for taxi commuters in South Africa. You help users with general questions about taxi etiquette, safety, how the TaxiFlow app works (it tracks live taxis and ranks), and standard commuting advice. Keep answers concise, friendly, and localized to South African taxi culture (e.g., using terms like 'sho't left', 'matha', 'front seat math', etc., but keep it understandable). Do not hallucinate real-time geolocation data since the system is currently waiting for real drivers to connect.";
                
                const payload = {
                    contents: [{ parts: [{ text: message }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                // Extract response text
                const botResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, my network is a bit slow. Can you try again?";
                
                // Update UI
                document.getElementById('loadingMsg').remove();
                const botDiv = document.createElement('div');
                botDiv.className = 'msg-bot';
                // Convert basic newlines to HTML breaks
                botDiv.innerHTML = botResponse.replace(/\n/g, '<br>');
                chatBox.appendChild(botDiv);
                
            } catch (error) {
                console.error("Gemini API Error:", error);
                document.getElementById('loadingMsg').remove();
                const errDiv = document.createElement('div');
                errDiv.className = 'msg-bot';
                errDiv.style.color = '#dc2626'; // Tailwind red-600
                errDiv.textContent = "Oops, connection error. Please try asking again.";
                chatBox.appendChild(errDiv);
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
